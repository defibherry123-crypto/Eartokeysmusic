const ST=[["Cindy E.","United States of America","Playing for 7 months","Performance: Chopin Nocturne No. 2","I highly recommend EarToKeysMusic to anyone looking to learn piano. They are incredibly passionate about teaching, which creates an inspiring learning environment. I was able to pick up my scales quickly under their guidance. Most importantly, the instructor is wonderfully supportive. He knows exactly how to motivate me and keep me moving forward on days when I feel discouraged. A fantastic educator!"],["Haifeng Xue","Singapore","Playing for 4 months","Recital: Liszt, La Campanella","I highly recommend EarToKeysMusic for anyone who wants to learn piano seriously and systematically. From my own experience, I started from zero and gradually progressed step by step with the teacher's patient guidance. Every lesson felt meaningful. What I appreciate most is that the lessons are not just about playing songs, but about building real musical understanding. A truly selfless, inspiring and excellent piano educator."],["Nayelie","United States of America","Playing for 4 months","Fundamentals: Basic Chord Progression","Studying piano under such an enthusiastic and passionate teacher has allowed me to truly flourish as a musician. Joshua's teaching style builds strong foundations with beginner techniques like scales and gradually develops them into more advanced and impressive musical skills. Under his guidance, I never feel stuck at the piano. Through his teaching, I have gained the ability to sit down at almost any piano and create something beautiful."]];

iv>`}</section><section class="catalog-help"><div><h2>Not sure where to begin?</h2><p>Explore our plans and find the right level for your piano journey.</p></div><a class="btn" href="#/pricing">Find your plan &rarr;</a></section></main>`)+'</div>'},

about(){return pub("about",`<div class="page"><div class="center"><span class="eye">Our mission</span><h1>About EartoKeysMusic</h1><p class="mut">Dedicated to bridging the gap between mechanical notes and the human soul through studio-quality piano pedagogy.</p></div><div class="two" style="grid-template-columns:1fr 1fr;align-items:center;margin:36px 0"><div><h2>Beyond the Sheet Music</h2><p class="mut">EarToKeysMusic is a professional music institution dedicated to teaching people how to play the piano by ear. Founded with the vision of making piano learning accessible to everyone, we are built on the belief that "If you can hear any music, you can play it."</p><p class="mut">Through structured video lessons, PDF guides, and practical courses, we help beginners, intermediate, and advanced learners develop confidence and master the piano at their own pace. Our simple, ear-based approach makes learning easy for children, teenagers, and adults by removing the barriers of traditional music reading.</p><p style="font:italic 400 19px 'EB Garamond',serif;border-left:3px solid var(--o);padding-left:14px;color:var(--mut)">At EarToKeysMusic, our mission is to transform passionate music lovers into skilled and confident pianists.</p></div><div class="img" style="min-height:340px;--g:radial-gradient(circle at 70% 25%,#e8a25a,#1a0f0b 65%)"></div></div><div class="two" style="grid-template-columns:1fr 1fr"><div><span class="eye">Our vision</span><p style="font:italic 400 24px/1.35 'EB Garamond',serif;margin-top:8px">To teach millions of passionate musicians globally how to play the piano by ear and understand music in general.</p></div><div><span class="eye">Our mission</span><p class="mut" style="margin-top:8px">Teaching individuals to play the piano by ear from beginner to advanced, through simple and structured lesson plans and courses.</p></div></div><h2 style="margin:44px 0 4px">Meet the team</h2><p class="mut">Mentorship from the world's most distinguished performers.</p><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(190px,1fr))">${[["Joshua Rapheal","Founder and Instructor"],["Elina Chris","Head of Contemporary Studies"],["Marcus Ubon","Virtuosity and Performance Coach"],["Unwana Berry","Professor of Music Theory"]].map((m,i)=>`<div>${Z(m[0].split(" ").map(w=>w[0]).join(""),G[i])}<h3 style="margin-top:8px">${m[0]}</h3><span class="mut" style="color:var(--od)">${m[1]}</span></div>`).join("")}</div><div class="center" style="background:var(--od);color:#fff;border-radius:24px;padding:48px 24px;margin-top:48px"><h2 style="font-size:34px">Start Your Performance Journey</h2><p>Join a global community of pianists who choose depth over speed and artistry over routine.</p><br><button class="btn" style="background:#fff;color:var(--od)" onclick="go('#/signup')">Start Learning</button></div></div>`)},
founder(){return pub("about",`<div class="img" style="min-height:300px;--g:radial-gradient(circle at 50% 30%,#5a3a22,#0d0807 70%);justify-content:flex-end;border-radius:0;padding:40px max(24px,calc(50% - 500px))"><span class="eye">The visionary</span><h1 style="font-family:'EB Garamond',serif;color:#fff">Joshua Rapheal</h1></div><div class="page"><div class="two" style="grid-template-columns:1fr 3fr;gap:40px"><div><p style="font:italic 400 22px 'EB Garamond',serif;color:var(--od)">"If you can hear any music, you can play it."</p><span class="eye">The philosophy</span><div class="box" style="margin-top:18px"><b>Fast facts</b><ul style="padding-left:18px;margin-top:8px;color:var(--mut)"><li>Founder, EarToKeysMusic</li><li>Graduate of AKSU</li><li>Mastered by ear as a child</li><li>Impacted 100+ global musicians</li></ul></div></div><div class="prose" style="margin:0;max-width:none"><p style="font:400 18px/1.8 'EB Garamond',serif;color:var(--ink)">Joshua Rapheal is a pianist, musician, music director, producer, entrepreneur, and consultant. Growing up as a pastor's child, he was always in a church environment where professional musicians frequently performed. This exposure sparked his passion for music. He took up the challenge of learning the piano when his father was transferred to a new church branch that had no musicians. As a child, he learned the piano and became so skilled that children's choirs, churches, and individuals began demanding his talent. As a teenager, he got his first contract with The African Church of Nigeria to teach both children and adults who were interested in learning the piano. Joshua has shared stages with renowned musicians and performed in various concerts and events, such as gospel concerts, jazz nights, and church conferences. He has taught music by ear to groups, choirs, children, and individuals through online, onsite, and offline sessions. Due to the growing demand from people across different countries and continents who are eager to learn the piano, he decided to help thousands around the world master the piano by ear at their own pace. This vision gave birth to the brand EarToKeysMusic, a professional music institution specializing in teaching piano by ear. Its core belief is: "If you can hear any music, you can play it." Over 100 aspiring musicians from around the world are currently benefiting from his video tutorials and PDFs (both free and paid). He is a graduate of Akwa Ibom State University and currently resides in Akwa Ibom State (AKS), Nigeria.</p><div class="row" style="border-top:1px solid var(--line);margin-top:24px;padding-top:18px;align-items:center"><span><i style="font:italic 500 26px 'Cormorant Garamond',serif;color:var(--od)">Joshua Rapheal</i><br><span class="mut">FOUNDER AND INSTRUCTOR</span></span><button class="btn" onclick="go('#/signup')">Start Learning &rarr;</button></div></div></div><div class="two" style="grid-template-columns:1fr 1fr;margin-top:36px"><div class="img" style="min-height:220px;--g:linear-gradient(135deg,#444,#aaa)"></div><div class="img" style="min-height:220px;--g:linear-gradient(135deg,#a98a66,#eadbc2)"></div></div></div>`)},

const IN={};

A.book=()=>{if(bk.done)return shell("s","app/book",`<div class="box center" style="max-width:480px;margin:40px auto"><h1>Your session is confirmed!</h1><p class="mut">${BT[bk.t][0]} with ${BI[bk.i][0]}<br>${bk.date} at ${bk.slot}</p><br><button class="btn" onclick="bk.done=false;go('#/app/dash')">Back to dashboard</button></div>`);

studio(){const pend=S.rev.filter(r=>r.st=="Pending");return shell("inst","studio",`<h1>Welcome back, ${S.user.name}.</h1><p class="mut">Your studio is flourishing. You have ${pend.length} performance reviews awaiting feedback.</p><div class="stats"><div class="box"><b>1,284</b>Total students</div><div class="box"><b>${S.ilessons.length}</b>Lessons</div><div class="box"><b>84%</b>Completion rate</div><div class="box"><b>$14,200</b>Monthly revenue</div></div><div class="two"><div><h3>Pending performance reviews</h3><div class="box">${pend.map(r=>`<div class="row"><span><b>${r.s}</b><br><span class="mut">${r.p}</span></span><button class="btn out sm" onclick="go('#/studio/reviews/${S.rev.indexOf(r)}')">Review</button></div>`).join("")||"<span class=mut>All caught up.</span>"}</div><h3 style="margin-top:18px">Recent student progress</h3><div class="box">${S.stud.slice(0,3).map(x=>`<div class="row"><span>${x[0]}<br><span class="mut">${x[1]}</span></span><span style="width:90px">${x[2]}%<div class="bar"><i style="width:${x[2]}%"></i></div></span></div>`).join("")}</div></div><div><h3>Quick actions</h3><div class="box"><button class="btn dk w" onclick="newC()">Create new course</button><br><br><button class="btn out w" onclick="go('#/studio/lesson')">Upload lesson</button></div><h3 style="margin-top:18px">Activity feed</h3><div class="box mut">David Chen enrolled in Piano Masterclass<br><br>Sophia Wood submitted an assignment<br><br>New 5-star rating on The Art of Legato</div></div></div>`)},
students(){return shell("inst","studio/students",`<h1>Student roster</h1><div class="stats"><div class="box"><b>42</b>Total students</div><div class="box"><b>86%</b>Active practice</div><div class="box"><b>28</b>Lessons this week</div></div><div class="tw"><table><tr><th>Student</th><th>Enrollment</th><th>Progress</th><th>Streak</th><th>Last active</th></tr>${S.stud.map(x=>`<tr><td><button class="link" onclick="go('#/studio/student/${S.stud.indexOf(x)}')">${x[0]}</button></td><td>${x[1]}</td><td style="min-width:120px">${x[2]}%<div class="bar"><i style="width:${x[2]}%"></i></div></td><td>${x[3]} days</td><td>${x[4]}</td></tr>`).join("")}</table></div><p class="mut">Showing ${S.stud.length} of 42 students</p>`)},
reviews(i){const r=i!=null&&S.rev[i];if(r)return shell("inst","studio/reviews",`<button class="link" onclick="go('#/studio/reviews')">&larr; Back to queue</button><h1>${r.p}</h1><p class="mut">${r.s} &middot; submitted ${r.d}</p><div class="two"><div class="vid" style="margin-top:14px"><div class="ctl">&#9654; Student recording</div></div><div class="box" style="display:flex;flex-direction:column;gap:12px"><h3>Feedback</h3>${["Technique","Dynamics","Tempo stability","Musicality"].map(k=>`<label>${k}<input type="range" min="1" max="10" value="7" class="rv" ${r.st!="Pending"?"disabled":""}></label>`).join("")}<label>Notes for the student<input id="rn" value="${r.n||""}"></label>${r.st=="Pending"?`<button class="btn w" onclick="rate(${i})">Complete evaluation</button>`:`<b>Grade: ${r.g}</b>`}</div></div>`);

async function loadCourses(){const d=await ETK.courses();CS=d.courses.map(c=>[esc(c.title),c.level,c.hours,c.students.toLocaleString("en-US"),c.priceUsd,c.priceNgn.toLocaleString("en-US"),esc(c.description),c.slug,c.lessonCount,c.rating,c.ratingCount])}

async function loadStudio(){

  if(!S.icourses.find(x=>x.id==S.ci))S.ci=S.icourses[0]?S.icourses[0].id:null
}
async function preload(a,b,c){
  if(a=="courses")return loadCourses();
  if(a=="course"){if(S.cdetSlug!=b){dm=0;dt="notes"}S.cdetSlug=b;try{S.cdet=await ETK.course(b)}catch(e){if(e.status==404)S.cdet=null;else throw e}return}
  if(a=="library")return loadRes();
  if(a=="app"){
    if(b=="resources")return loadRes();
    if(b=="account")return loadHist();
    if(b=="uploads")return loadCourses();
    if(["community","book","settings"].includes(b))return;
    return loadLessons()
  }
  if(a=="studio"){S.studioErr="";try{await loadStudio();if(b=="resources")await loadRes()}catch(e){if(e.status==403)S.studioErr=e.message;else throw e}return}
  if(a=="admin"){
    const t=b||"admin";
    if(t=="admin")S.ov=await ETK.call("GET","/api/admin/overview");
    else if(t=="videos")await loadStudio();
    else if(t=="users")S.users=(await ETK.call("GET","/api/admin/users"+(uq?"?q="+encodeURIComponent(uq):""))).users;
    else if(t=="payments")S.pays=(await ETK.call("GET","/api/admin/payments")).payments;
    else if(t=="resources")await loadRes();
    else if(t=="support")S.msgs=(await ETK.call("GET","/api/admin/support")).messages
  }
}

async function pay(){
  const i=[...document.querySelectorAll("input[name=m]")].findIndex(x=>x.checked),b=$("#pay");
  b.disabled=true;b.textContent="Opening secure payment...";
  try{const r=await ETK.checkout(S.pick,S.bill=="y"?"annual":"monthly",["card","paystack","bank_transfer"][i<0?1:i]);location.href=r.authorizationUrl}
  catch(e){b.disabled=false;b.textContent="Pay securely";if(e.code=="email_not_verified"){toast("Verify your email first");go("#/verify")}else fail(e)}
}
function pollPay(ref){
  if(!ref)return go("#/app/dash");
  let n=0;
  const tick=async()=>{
    if(!location.hash.startsWith("#/securing"))return;
    try{const d=await ETK.paymentStatus(ref),s=d.payment.status;if(s=="success"){setAccess(d.access);return go("#/success")}if(s!="pending")return go("#/failed")}catch(e){if(e.status==401)return fail(e)}
    if(++n>60)return go("#/failed");
    pollT=setTimeout(tick,2000)
  };
  tick()
}

  return pub("library",`<div class="page"><div class="center"><h1>Explore Our Library</h1><p class="mut">A curated archive of high-fidelity sheet music, technique guides and historical manuscripts for the dedicated pianist.</p><input id="qs" placeholder="Search archive (e.g. Scales, MIDI)" value="${esc(libq)}" oninput="libq=this.value.toLowerCase();rt(1)" style="width:min(420px,100%);margin-top:12px"></div>${feat.length?`<p class="eye" style="margin:32px 0 12px">Featured downloads</p><div class="two" style="grid-template-columns:repeat(${feat.length},1fr)">${feat.map((r,i)=>`<div class="img" style="min-height:220px;--g:linear-gradient(135deg,${i?"#8a6a4a,#cdb894":"#2a1d0e,#c9a56a"})"><span class="tag" style="background:var(--o);color:#fff">${esc(r.kind)}</span><h2 style="font-family:'Cormorant Garamond',serif;font-size:28px">${esc(r.title)}</h2><p>${esc(r.subtitle)}</p><button class="btn" style="background:#fff;color:#1a1210" onclick="dl(${r.id})">Download ${esc(r.kind)}</button></div>`).join("")}</div>`:""}<div class="tabs" style="margin-top:28px">${["All Resources","Sheet Music","MIDI Files"].map(x=>`<button class="chip ${libf==x?"on":""}" onclick="libf='${x}';rt()">${x}</button>`).join("")}</div><div class="grid">${l.map((r,i)=>`<div class="vc"><div class="th" style="--g:linear-gradient(135deg,${G[i%4]});height:150px">&#9835;<span class="lvl">${esc(r.kind)}</span></div><div class="in"><h3>${esc(r.title)}</h3><span class="mut">${esc(r.subtitle)}</span><br><br>${r.available?`<button class="btn out sm w" onclick="dl(${r.id})">Download</button>`:`<button class="btn out sm w" disabled>Coming soon</button>`}</div></div>`).join("")||"<p class=mut>Nothing matches your search.</p>"}</div></div>`)
},
support(){return pub("",`<div class="page" style="max-width:560px"><div class="center"><h1>Contact Support</h1><p class="mut">Technical or account questions? Send us a message and we will reply by email.</p></div><div class="box" style="display:flex;flex-direction:column;gap:12px;margin-top:18px"><label>Name<input id="sn1" value="${S.user?S.user.name:""}"></label><label>Email<input id="se1" type="email" value="${S.user?S.user.email:""}"></label><label>Subject<input id="ss1"></label><label>Message<textarea id="sm1" rows="4"></textarea></label><button class="btn" onclick="sendSupport()">Send message</button><span class="mut">Or email support@eartokeysmusic.com</span></div></div>`)}
});
function lessonGo(id){if(!S.user){toast("Create a free account to watch lessons");return go("#/signup")}go("#/app/play/"+id)}
async function sendSupport(){const n=$("#sn1").value.trim(),e=$("#se1").value.trim(),m=$("#sm1").value.trim();if(!n||!e.includes("@")||m.length<5)return toast("Add your name, email and a message");try{await ETK.contact(n,e,$("#ss1").value.trim()||"Support request",m);toast("Message sent. We will reply by email.");go("#/faq")}catch(x){toast(x.message)}}

// ---------- instructor studio (courses, lessons, video upload) ----------
const vtype=f=>({mp4:"video/mp4",m4v:"video/mp4",webm:"video/webm",mov:"video/quicktime"})[(f.name.split(".").pop()||"").toLowerCase()]||f.type;
function prog(p){let t=$("#upt");if(!t){t=document.createElement("div");t.id="upt";t.className="toast";document.body.append(t)}t.textContent=p>=100?"Processing...":"Uploading "+p+"%";clearTimeout(t._x);t._x=setTimeout(()=>t.remove(),p>=100?2500:8000)}
ls={t:"",file:null,courseId:null,m:"Module 1",free:false,dur:0};
IN.lessons=()=>shell("inst","studio/lessons",`<div class="row"><div><h1>Lesson plans</h1><p class="mut">All lessons across your courses.</p></div><button class="btn" onclick="newLesson()">+ Create new lesson</button></div><div class="tabs">${["All",...L].map(x=>`<button class="chip ${lf==x?"on":""}" onclick="lf='${x}';rt()">${x}</button>`).join("")}</div><div class="grid">${S.ilessons.filter(v=>lf=="All"||cOf(v.courseId).level==lf).map(v=>`<div class="vc"><div class="th" style="--g:linear-gradient(135deg,${G[v.courseId%4]})">${v.hasVideo?"&#9654;":"&#9203;"}</div><div class="in"><span class="tag">${esc(cOf(v.courseId).level||"")}</span> <span class="mut">${v.published?"Published":"Draft"}${v.hasVideo?"":" &middot; no video"}</span><h3 style="margin:6px 0 2px">${esc(v.title)}</h3><span class="mut">${esc(cOf(v.courseId).title||"")}</span><br><br><div style="display:flex;gap:6px"><button class="btn out sm" style="flex:1" onclick="pubV(${v.id})">${v.published?"Unpublish":"Publish"}</button><button class="btn out sm" onclick="upV(${v.id})">${v.hasVideo?"Replace video":"Upload video"}</button></div></div></div>`).join("")||'<p class="mut">No lessons yet.</p>'}</div>`);
IN.resources=()=>shell("inst","studio/resources",`<h1>Resource library</h1><p class="mut">Sheet music and MIDI files students can download. The admin team uploads these for now.</p><br><div class="tw"><table><tr><th>Name</th><th>Type</th><th>Category</th><th>File</th></tr>${S.pubres.map(r=>`<tr><td>${esc(r.title)}</td><td>${esc(r.kind)}</td><td>${esc(r.category)}</td><td>${r.available?"Uploaded":"Missing"}</td></tr>`).join("")}</table></div>`);
Object.assign(IN,{
courses(){
  const c=S.icourses.find(x=>x.id==S.ci),ls2=c?S.ilessons.filter(l=>l.courseId==c.id):[],mods=[...new Set(ls2.map(l=>l.module))];
  return shell("inst","studio/courses",`<div class="row"><div><h1>Curriculum management</h1><p class="mut">Edit your courses and build new learning journeys.</p></div><button class="btn" onclick="newC()">+ Create new course</button></div><div class="grid">${S.icourses.map((x,i)=>`<div class="vc" style="${x.id==S.ci?"border-color:var(--o)":""}"><div class="th" style="--g:linear-gradient(135deg,${G[i%4]})"></div><div class="in"><span class="tag">${esc(x.level)}</span> <span class="mut">${x.published?"Published":"Draft"}</span><h3 style="margin:6px 0 2px">${esc(x.title)}</h3><span class="mut">${S.ilessons.filter(l=>l.courseId==x.id).length} lessons</span><br><br><button class="btn out sm w" onclick="S.ci=${x.id};rt()">${x.id==S.ci?"Currently editing":"Manage"}</button></div></div>`).join("")||'<p class="mut">No courses yet. Create your first one.</p>'}</div>${c?`<div class="box" style="margin-top:22px"><div class="row"><div><h2>${esc(c.title)}</h2><span class="mut">${mods.length} modules &middot; ${ls2.length} lessons &middot; students ${c.published?"can":"cannot yet"} see this course</span></div><span><button class="btn out sm" onclick="editC(${c.id})">Edit details</button> <button class="btn dk sm" onclick="togC(${c.id},${c.published?0:1})">${c.published?"Unpublish course":"Publish course"}</button></span></div>${mods.map((m,mi)=>`<h3 style="margin-top:14px">${esc(m)}</h3>${ls2.filter(l=>l.module==m).map(l=>`<div class="les" style="background:var(--card);margin:6px 0;justify-content:space-between"><span>${esc(l.title)} <span class="mut">&middot; ${l.published?"Published":"Draft"}${l.hasVideo?"":" &middot; no video"}</span></span><span><button class="link" onclick="pubV(${l.id})">${l.published?"Unpublish":"Publish"}</button> &nbsp; <button class="link" onclick="delL(${l.id})">Remove</button></span></div>`).join("")}<button class="btn out sm" onclick="addL(${mi})">+ Add lesson</button>`).join("")||'<p class="mut" style="margin-top:12px">No lessons yet.</p>'}<br><br><button class="btn out sm" onclick="addM()">+ Insert new module</button></div>`:""}`)
},
lesson(){
  const cs=S.icourses;
  if(!cs.length)return shell("inst","studio/lesson",`<h1>Video studio</h1><div class="box center" style="max-width:480px;margin:30px 0"><p class="mut">Create a course first, then add lessons to it.</p><br><button class="btn" onclick="newC()">Create course</button></div>`);
  if(!cs.find(c=>c.id==ls.courseId))ls.courseId=S.ci||cs[0].id;
  const mods=[...new Set(S.ilessons.filter(l=>l.courseId==ls.courseId).map(l=>l.module))];
  return shell("inst","studio/lesson",`<div class="row"><div><h1>Video studio</h1><p class="mut">Compose, upload and refine your next piano masterclass.</p></div><span><button class="btn out sm" onclick="pubL(0)">Save draft</button> <button class="btn sm" onclick="pubL(1)">Publish lesson</button></span></div><div class="two"><div class="box center" style="padding:40px"><h3>Select your lesson video</h3><p class="mut">MP4, MOV or WEBM. Stored privately and streamed to subscribers only.</p><br><input type="file" id="lf" accept="video/mp4,video/webm,video/quicktime,.mp4,.mov,.webm" hidden onchange="pickF(this)"><button class="btn out" onclick="$('#lf').click()">${ls.file?esc(ls.file.name)+" ("+(ls.file.size/1048576).toFixed(1)+" MB)":"Select file"}</button></div><div class="box" style="display:flex;flex-direction:column;gap:12px"><h3>Lesson details</h3><label>Lesson title<input id="lt" value="${esc(ls.t)}" oninput="ls.t=this.value" placeholder="e.g. Debussy: Clair de Lune"></label><label>Course<select id="lc" onchange="ls.courseId=+this.value;rt()">${cs.map(c=>`<option value="${c.id}" ${c.id==ls.courseId?"selected":""}>${esc(c.title)} (${esc(c.level)})</option>`).join("")}</select></label><label>Module<input id="lm" list="mods" value="${esc(ls.m)}" oninput="ls.m=this.value"><datalist id="mods">${mods.map(m=>`<option value="${esc(m)}">`).join("")}</datalist></label><label class="opt" style="flex-direction:row"><input type="checkbox" id="lp" ${ls.free?"checked":""} onchange="ls.free=this.checked">Free preview: anyone with an account can watch</label></div></div>`)
}
});
function pickF(i){const f=i.files[0];if(!f)return;ls.file=f;ls.dur=0;const v=document.createElement("video");v.preload="metadata";v.onloadedmetadata=()=>{ls.dur=Math.round(v.duration)||0;URL.revokeObjectURL(v.src)};v.src=URL.createObjectURL(f);rt()}
function newLesson(){ls.courseId=S.ci;go("#/studio/lesson")}
async function pubL(p){
  const t=ls.t.trim();if(!t)return toast("Add a lesson title");if(p&&!ls.file)return toast("Select a video file first");
  let id=null;
  try{
    const d=await ETK.call("POST","/api/studio/lessons",{courseId:ls.courseId,module:(ls.m||"Module 1").trim(),title:t,durationSec:ls.dur||0,freePreview:!!ls.free});id=d.lesson.id;
    if(ls.file)await ETK.upload("/api/studio/lessons/"+id+"/file",ls.file,prog,vtype(ls.file));
    if(p)await ETK.call("PATCH","/api/studio/lessons/"+id,{published:true});
    const pubd=cOf(ls.courseId).published;S.ci=ls.courseId;ls={t:"",file:null,courseId:S.ci,m:ls.m,free:false,dur:0};
    toast(p?(pubd?"Lesson published to the student library":"Lesson published. Publish the course so students can see it."):"Draft saved");go("#/studio/lessons")
  }catch(e){if(id&&ls.file){try{await ETK.call("DELETE","/api/studio/lessons/"+id)}catch(x){}}fail(e)}
}
function upV(id){const i=document.createElement("input");i.type="file";i.accept="video/mp4,video/webm,video/quicktime,.mp4,.mov,.webm";i.onchange=async()=>{const f=i.files[0];if(!f)return;try{prog(0);await ETK.upload("/api/studio/lessons/"+id+"/file",f,prog,vtype(f));toast("Video uploaded");await reload()}catch(e){fail(e)}};i.click()}
async function pubV(id){const v=S.ilessons.find(x=>x.id==id);if(!v)return;try{await ETK.call("PATCH","/api/studio/lessons/"+id,{published:!v.published});await reload()}catch(e){fail(e)}}
async function delL(id){if(!confirm("Remove this lesson and its video?"))return;try{await ETK.call("DELETE","/api/studio/lessons/"+id);await reload()}catch(e){fail(e)}}
async function newC(){const t=prompt("Course title");if(!t)return;const lv=prompt("Level: Beginner, Intermediate or Advanced","Beginner");if(!L.includes(lv))return toast("Level must be Beginner, Intermediate or Advanced");try{const d=await ETK.call("POST","/api/studio/courses",{title:t,level:lv,hours:0,description:""});S.ci=d.course.id;ls.courseId=S.ci;if(location.hash=="#/studio/courses")await reload();else go("#/studio/courses")}catch(e){fail(e)}}
async function editC(id){const c=cOf(id),t=prompt("Course title",c.title);if(!t)return;const h=prompt("Total hours of content",c.hours);const d=prompt("Short description",c.description||"");try{await ETK.call("PATCH","/api/studio/courses/"+id,{title:t,hours:+h||0,description:d||""});await reload()}catch(e){fail(e)}}
async function togC(id,p){try{await ETK.call("PATCH","/api/studio/courses/"+id,{published:!!p});toast(p?"Course published":"Course unpublished");await reload()}catch(e){fail(e)}}
function addL(mi){const mods=[...new Set(S.ilessons.filter(l=>l.courseId==S.ci).map(l=>l.module))];ls.courseId=S.ci;ls.m=mods[mi]||"Module 1";go("#/studio/lesson")}
function addM(){const m=prompt("Module name");if(!m)return;ls.courseId=S.ci;ls.m=m.trim();go("#/studio/lesson")}

// ---------- admin ----------
const AD={
admin(){const o=S.ov||{users:{},subscriptions:{},revenue30d:{},lessons:{}};return shell("admin","admin",`<h1>Admin overview</h1><div class="stats"><div class="box"><b>${o.users.students}</b>Students</div><div class="box"><b>${o.subscriptions.active}</b>Active subscriptions</div><div class="box"><b>${o.subscriptions.grace}</b>In grace period</div><div class="box"><b>${o.subscriptions.expired}</b>Expired</div><div class="box"><b>${naira(o.revenue30d.amount)}</b>Revenue, last 30 days</div><div class="box"><b>${o.lessons.published}/${o.lessons.total}</b>Published lessons</div><div class="box"><b>${o.lessons.awaitingVideo}</b>Lessons awaiting video</div><div class="box"><b>${o.users.pendingInstructors}</b>Instructors to approve</div><div class="box"><b>${o.openSupport}</b>Open support messages</div></div>`)},
videos(){return shell("admin","admin/videos",`<div class="row"><h1>Videos</h1><button class="btn sm" onclick="go('#/studio/lesson')">+ Add video</button></div><div class="tw"><table><tr><th>Title</th><th>Course</th><th>Level</th><th>Length</th><th>Status</th><th>Video</th><th></th></tr>${S.ilessons.map(v=>`<tr><td>${esc(v.title)}</td><td>${esc(cOf(v.courseId).title||"")}</td><td>${esc(cOf(v.courseId).level||"")}</td><td>${mins(v.durationSec)} min</td><td>${v.published?"Published":"Draft"}</td><td>${v.hasVideo?(v.sizeBytes?(v.sizeBytes/1048576).toFixed(1)+" MB":"Uploaded"):"Missing"}</td><td style="white-space:nowrap"><button class="btn out sm" onclick="upV(${v.id})">${v.hasVideo?"Replace":"Upload"}</button> <button class="btn out sm" onclick="pubV(${v.id})">${v.published?"Unpublish":"Publish"}</button></td></tr>`).join("")}</table></div>`)},
users(){return shell("admin","admin/users",`<h1>Users</h1><br><div class="row" style="justify-content:flex-start"><input id="uq" placeholder="Search name or email" value="${esc(uq)}" onkeydown="if(event.key=='Enter'){uq=this.value.trim();reload()}" style="width:280px"><button class="btn out sm" onclick="uq=$('#uq').value.trim();reload()">Search</button></div><br><div class="tw"><table><tr><th>Name</th><th>Email</th><th>Role</th><th>Plan</th><th>Access</th><th></th></tr>${S.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}${u.emailVerified?"":' <span class="mut">(unverified)</span>'}</td><td>${esc(u.role)}${u.disabled?" (disabled)":""}</td><td>${esc(u.access&&u.access.plan||"None")}</td><td>${esc(u.access&&u.access.state||"none")}${u.access&&u.access.state=="grace"?" ("+u.access.graceDaysLeft+"d left)":""}</td><td style="white-space:nowrap">${u.role=="student"?`<select id="gp${u.id}" style="width:auto">${L.map(l=>`<option>${l}</option>`).join("")}</select> <button class="btn out sm" onclick="grant(${u.id})">Grant 1 month</button> `:""}${u.role=="instructor"?(u.instructorApproved?"Approved ":`<button class="btn out sm" onclick="approveI(${u.id})">Approve</button> `):""}${u.id==S.user.id?"":`<button class="link" onclick="disableU(${u.id},${u.disabled?0:1})">${u.disabled?"Enable":"Disable"}</button>`}</td></tr>`).join("")}</table></div>`)},
payments(){return shell("admin","admin/payments",`<h1>Payments</h1><br><div class="tw"><table><tr><th>Date</th><th>Email</th><th>Plan</th><th>Amount</th><th>Status</th><th>Reference</th></tr>${(S.pays||[]).map(p=>`<tr><td>${when(p.createdAt)}</td><td>${esc(p.email)}</td><td>${esc(p.plan)} ${esc(p.billing)}</td><td>${naira(p.amount)}</td><td>${esc(p.status)}${p.failureReason?" ("+esc(p.failureReason)+")":""}</td><td class="mut">${esc(p.reference)}</td></tr>`).join("")||'<tr><td colspan="6" class="mut">No payments yet.</td></tr>'}</table></div>`)},
resources(){return shell("admin","admin/resources",`<h1>Resources</h1><p class="mut">Sheet music and MIDI files for the library.</p><br><div class="box" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;align-items:end"><label>Title<input id="ar_t"></label><label>Subtitle<input id="ar_s"></label><label>Type<select id="ar_k"><option>PDF</option><option>MIDI</option><option>DOC</option></select></label><label>Category<select id="ar_c"><option>Sheet Music</option><option>MIDI Files</option></select></label><label>Needs plan<select id="ar_l"><option value="">Free (no plan)</option>${L.map(l=>`<option>${l}</option>`).join("")}</select></label><label class="opt" style="flex-direction:row;margin:0"><input type="checkbox" id="ar_f">Featured</label><button class="btn" onclick="addR()">Add resource</button></div><br><div class="tw"><table><tr><th>Name</th><th>Type</th><th>Category</th><th>Plan</th><th>File</th><th></th></tr>${S.pubres.map(r=>`<tr><td>${esc(r.title)}</td><td>${esc(r.kind)}</td><td>${esc(r.category)}</td><td>${esc(r.minLevel||"Free")}</td><td>${r.available?"Uploaded":"Missing"}</td><td><button class="btn out sm" onclick="upR(${r.id})">${r.available?"Replace file":"Upload file"}</button></td></tr>`).join("")}</table></div>`)},
support(){return shell("admin","admin/support",`<h1>Support messages</h1><br><div class="tw"><table><tr><th>Date</th><th>From</th><th>Subject</th><th>Message</th><th></th></tr>${(S.msgs||[]).map(m=>`<tr><td>${when(m.created_at)}</td><td>${esc(m.name)}<br><span class="mut">${esc(m.email)}</span></td><td>${esc(m.subject)}</td><td style="max-width:360px">${esc(m.message)}</td><td>${m.status=="open"?`<button class="btn out sm" onclick="closeM(${m.id})">Close</button>`:"Closed"}</td></tr>`).join("")||'<tr><td colspan="5" class="mut">No messages.</td></tr>'}</table></div>`)}
};
async function grant(id){try{await ETK.call("POST","/api/admin/users/"+id+"/grant",{plan:$("#gp"+id).value,billing:"monthly",note:"Granted from the admin panel"});toast("Access granted");await reload()}catch(e){fail(e)}}
async function approveI(id){try{await ETK.call("POST","/api/admin/instructors/"+id+"/approve",{approved:true});toast("Instructor approved");await reload()}catch(e){fail(e)}}
async function disableU(id,off){try{await ETK.call("POST","/api/admin/users/"+id+"/disable",{disabled:!!off});await reload()}catch(e){fail(e)}}
async function closeM(id){try{await ETK.call("POST","/api/admin/support/"+id+"/close");await reload()}catch(e){fail(e)}}
async function addR(){const t=$("#ar_t").value.trim();if(!t)return toast("Add a title");try{await ETK.call("POST","/api/admin/resources",{title:t,subtitle:$("#ar_s").value.trim(),kind:$("#ar_k").value,category:$("#ar_c").value,minLevel:$("#ar_l").value||undefined,featured:$("#ar_f").checked});toast("Resource added. Now upload its file.");await reload()}catch(e){fail(e)}}
function upR(id){const i=document.createElement("input");i.type="file";i.accept=".pdf,.mid,.midi,.zip";i.onchange=async()=>{const f=i.files[0];if(!f)return;const ext=(f.name.split(".").pop()||"").toLowerCase(),ct={pdf:"application/pdf",mid:"audio/midi",midi:"audio/midi",zip:"application/zip"}[ext];if(!ct)return toast("Use a PDF, MIDI (.mid) or ZIP file");try{prog(0);await ETK.upload("/api/admin/resources/"+id+"/file",f,prog,ct);toast("File uploaded");await reload()}catch(e){fail(e)}};i.click()}

// ---------- router ----------
const PROTECTED=["app","admin","studio","level","verify","plans","checkout","securing","success","failed","onboard"];
function route(){const raw=location.hash.replace(/^#\/?/,"")||"home",i=raw.indexOf("?");Q=new URLSearchParams(i<0?"":raw.slice(i+1));const[a,b,c]=(i<0?raw:raw.slice(0,i)).split("/");return{a,b,c}}
function render(){
  clearTimeout(pollT);clearInterval(wmT);
  const{a,b,c}=route();let o;
  if(a=="home"){$("#app").innerHTML='<div id="lp"></div>';const r=$("#lp").attachShadow({mode:"open"});r.innerHTML=LP;initLanding(r);return}
  if(PROTECTED.includes(a)&&!S.user)return go("#/login");
  if(a=="studio"&&S.studioErr)o=shell("inst","studio",`<div class="box center" style="max-width:520px;margin:40px auto"><h1>Almost there</h1><p class="mut">${esc(S.studioErr)}</p></div>`);
  else if(a=="app")o=(A[b||"dash"]||A.dash)(c);
  else if(a=="admin")o=(AD[b||"admin"]||AD.admin)();
  else if(PUB[a])o=PUB[a](b);
  else if(a=="studio")o=(IN[b||"studio"]||IN.studio)(c);
  else o=(V[a]||V.login)(b);
  $("#app").innerHTML=o
}
async function nav(quiet){
  const my=++rid,{a,b,c}=route();
  const lt=quiet?0:setTimeout(()=>{if(my===rid&&a!="home")$("#app").innerHTML='<div class="page center mut" style="padding-top:120px">Loading&hellip;</div>'},300);
  try{
    if(S.user||!booted)await refreshMe();
    booted=true;
    if(my!==rid)return;
    if(PROTECTED.includes(a)&&!S.user)return go("#/login");
    if((a=="admin"&&S.user.role!="admin")||(a=="studio"&&S.user.role=="sub"))return go("#/"+home());
    await preload(a,b,c)
  }catch(e){if(my!==rid)return;if(e&&e.status==401)return fail(e);toast((e&&e.message)||"Could not load this page.")}
  finally{clearTimeout(lt)}
  if(my!==rid)return;
  render();
  if(a=="app"&&b=="play")initPlayer(c);
  if(a=="securing")pollPay(Q.get("reference"))
}
addEventListener("hashchange",()=>{scrollTo(0,0);nav()});
(async()=>{try{await loadPlans()}catch(e){}nav()})();
</script></body></html>
