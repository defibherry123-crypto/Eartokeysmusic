const ST=[["Cindy E.", "United State of America", "Playing for 7 months", "Performance: Chopin Nocturne No. 2", "I highly recommend EarToKeysMusic for anyone looking to learn piano. They are incredibly passionate about teaching, which creates an inspiring learning environment. I was able to pick up my scales quickly under their guidance. Most importantly, the Instructor is wonderfully supportive—he knows exactly how to motivate me and keep me moving forward on days when I feel discouraged. A fantastic educator!"], ["Haifeng Xue", "Singapore", "Playing for 4 months", "Recital: Liszt - La Campanella", "I highly recommend EarToKeysMusic for anyone who wants to learn piano seriously and systematically. From my own experience, I started from zero and gradually progressed step by step with the teacher’s patient guidance. Every lesson felt meaningful, and I could clearly see myself improving each time.\nWhat I appreciate most is that the lessons are not just about playing songs, but about building real musical understanding. We learn many advanced but practical musical techniques, such as chord inversions, arpeggio techniques, and song arrangement skills that are difficult to pick up properly without structured guidance from a dedicated teacher. The teacher’s passion, seriousness, and energy in every lesson are truly impressive. You can feel that the teaching is not driven by profit, but by a genuine love for music and a sincere desire to help students grow and achieve their musical dreams.\nA truly selfless, inspiring, and excellent piano educator.\nHighly recommended! EarToKeysMusic"], ["Nayelie", "United States of America", "Playing for 4 months", "Fundamentals: Basic Chord Progression", "Studying piano under such an enthusiastic and passionate teacher has allowed me to truly flourish as a musician. Joshua’s teaching style builds strong foundations by starting with beginner techniques like scales and gradually developing them into more advanced and impressive musical skills. He emphasizes understanding and using the entire keyboard, helping me feel confident and expressive in my playing. Under his guidance, I never feel stuck at the piano because he always finds ways to help me grow, improve, and approach music with confidence. Through his teaching, I have gained the ability to sit down at almost any piano and create something beautiful. If given the choice, I would choose him as a teacher every single time because of the passion, encouragement, and musical growth he brings to every lesson."]];

 to advanced, through simple and structured lesson plans and courses.</p></div></section><section class="about-team"><div class="about-team-wrap"><h2>Meet the Team</h2><p class="about-team-lead">Mentorship from the world's most distinguished performers.</p><div class="about-team-grid">${team.map(([key,name,role])=>{const image=imageFor('feature','team-'+key);return `<article><div class="about-team-portrait"><span class="about-team-initials" aria-hidden="true">${name.split(' ').map(n=>n[0]).join('')}</span>${image?uploadedPhoto(image):key==='joshua'?'<img class="about-founder-fallback" src="/assets/founder.png" alt="" onerror="this.remove()">':''}</div><h3>${name}</h3><p>${role}</p></article>`}).join('')}</div></div></section><section class="about-cta-region"><div class="about-cta"><h2>Start Your Performance Journey</h2><p>Join a global community of pianists who choose depth over speed and artistry<br class="about-wide-break"> over routine.</p><a class="btn" href="#/signup">Start Learning</a></div></section></main>`).replace('<div class="soc"><span>Tk</span><span>Yt</span><span>X</span><span>f</span><span>Ig</span></div>',librarySocialIcons())+'</div>'},

founder(){const banner=imageFor('feature','founder-banner');return '<div class="courses-reference library-reference founder-reference">'+pub("about",`<main><header class="founder-hero" aria-label="Joshua Rapheal, founder and instructor"><h1 class="founder-screen-reader">Joshua Rapheal</h1>${banner?uploadedPhoto(banner):'<img class="founder-local-photo" src="/assets/founder.png" alt="" onerror="this.remove()">'}</header><div class="founder-wrap"><div class="founder-content"><div class="founder-sidebar"><div class="founder-philosophy"><span class="founder-quote-mark" aria-hidden="true">&rdquo;</span><blockquote>&ldquo;If you can hear any music, you can play it.&rdquo;</blockquote><p>&mdash; The philosophy</p></div><section class="founder-facts" aria-label="Fast Facts"><h2>Fast Facts</h2><ul><li>Founder, EarToKeysMusic</li><li>Graduate of AKSU</li><li>Mastered by ear as a child</li><li>Impacted 100+ global musicians</li></ul></section></div><div class="founder-biography"><p class="founder-biography-text">Joshua Rapheal is a pianist, musician, music director, producer, entrepreneur, and consultant. Growing up as a pastor’s child, he was always in a church environment where professional musicians frequently performed. This exposure sparked his passion for music. He took up the challenge of learning the piano when his father (a pastor) was transferred to a new church branch that had no musicians, even though musical instruments, including a piano, were available. As a child, he learned the piano and became so skilled that children’s choirs, churches, and individuals began demanding his talent. As a teenager, he got his first contract with The African Church of Nigeria to teach both children and adults who were interested in learning the piano. A large percentage of them mastered it and are still playing today. Joshua has shared stages with renowned musicians and performed in various concerts and events, such as gospel concerts, jazz nights, and church conferences. He has taught music by ear to groups, choirs, children, and individuals through online, onsite and offline sessions. Due to the growing demand from people across different countries and continents who are eager to learn the piano, he decided to help thousands around the world master the piano by ear at their own pace. This vision gave birth to the brand EarToKeysMusic, a professional music institution specializing in teaching piano by ear. Its core belief is: “If you can hear any music, you can play it.” He launched an institution that would not only change his own life but also impact thousands of musicians through online videos, books, and instructional courses. Over 100 aspiring musicians from around the world are currently benefiting from his video tutorials and PDFs (both free and paid). He is a graduate of Akwa Ibom State University and currently resides in Akwa Ibom State (AKS), Nigeria.</p><div class="founder-signoff"><div><p class="founder-signature">Joshua Rapheal</p><p class="founder-role">Founder &amp; Instructor</p></div><a class="btn" href="#/signup">Start Learning <span aria-hidden="true">&rarr;</span></a></div></div></div><section class="founder-gallery" aria-label="Piano learning and studio"><div class="founder-gallery-image" role="img" aria-label="Piano practice">${uploadedPhoto(imageFor('feature','founder-practice'))}</div><div class="founder-gallery-image" role="img" aria-label="EarToKeysMusic teaching studio">${uploadedPhoto(imageFor('feature','founder-studio'))}</div></section></div></main>`).replace('<div class="soc"><span>Tk</span><span>Yt</span><span>X</span><span>f</span><span>Ig</span></div>',librarySocialIcons())+'</div>'},
faq(){return '<div class="courses-reference library-reference faq-reference">'+pub("",`<main class="faq-main"><header class="faq-intro"><span class="faq-badge">Support center</span><h1>Frequently Asked Questions</h1><p>Everything you need to know about subscriptions, payments, and your musical<br class="faq-wide-break"> journey with us.</p></header><section class="faq-questions" aria-label="Frequently asked questions">${FQ.map((q,i)=>`<details class="faq-question" name="support-faq" ${i===2?'open':''}><summary><span>${esc(q[0])}</span><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m5 7.5 5 5 5-5"/></svg></summary><p>${esc(q[1])}</p></details>`).join('')}</section><section class="faq-support"><h2>Still have questions?</h2><p>Our dedicated support team is here to help you with any technical or<br class="faq-wide-break"> account-related inquiries.</p><a class="btn" href="#/support">Contact Support <span aria-hidden="true">&rarr;</span></a></section></main>`).replace('<div class="soc"><span>Tk</span><span>Yt</span><span>X</span><span>f</span><span>Ig</span></div>',librarySocialIcons())+'</div>'},
blog(){const l=BP.map((b,i)=>[b,i]).filter(([b])=>bf==='All'||b[5]===bf);return '<div class="courses-reference library-reference blog-reference">'+pub("",`<main class="blog-main"><header class="blog-intro"><h1>Inside the Studio</h1><p>Live updates and exclusive peeks into the EarToKeys creative engine.</p></header><section class="blog-featured" aria-label="Inside the studio"><article class="blog-masterclass">${uploadedPhoto(imageFor('feature','blog-masterclass'))}<div class="blog-masterclass-content"><span class="blog-feature-badge">New masterclass</span><h2>Joshua's New Masterclass Series</h2><p>Unlock the secrets of fluid jazz improvisation with our latest 10-part series.</p><a href="#/courses">Watch session &rarr;</a></div></article><div class="blog-side"><article class="blog-side-panel"><span class="eye">Student highlight</span><h2>Cindy E.</h2><a href="#/testimonials">Read her journey</a></article><article class="blog-side-panel"><span class="eye">Live session</span><h2>Piano Theory and Chill</h2><p>Join us this Friday at 7 PM EST.</p><button class="btn dk" onclick="toast('A session date must be published before reminders are available.')">Set reminder</button></article></div></section><div class="blog-latest-header"><h2>The latest</h2><div class="tabs" role="group" aria-label="Filter articles">${['All','Technical','Entertainment'].map(x=>`<button class="chip ${bf===x?'on':''}" aria-pressed="${bf===x}" onclick="bf='${x}';rt()">${x}</button>`).join('')}</div></div><section class="blog-articles" aria-label="Latest articles">${l.map(([b,i])=>`<article class="blog-article"><div class="blog-article-image" style="--crop:${i%2?'80% 30%':'60% 80%'}">${uploadedPhoto(imageFor('feature',['blog-method','blog-studio','blog-covers'][i]))}<span>${b[0]}</span></div><div class="blog-article-body"><h2>${b[1]}</h2><p>${b[2]}</p><small>${b[3]} &middot; ${b[4]}</small></div></article>`).join('')}</section><section class="blog-newsletter"><h2>Don't miss an Eartokeys update</h2><p>Get fresh updates, early access and technique deep-dives in your inbox.</p><form class="blog-subscribe-form" onsubmit="event.preventDefault();subscribeNewsletter()"><label class="blog-email-label" for="nl">Email address<input id="nl" name="email" type="email" autocomplete="email" maxlength="254" required placeholder="Your email..."></label><button class="btn" id="newsletter-submit" type="submit">Subscribe</button></form><p class="blog-subscribe-status" id="newsletter-status" role="status" hidden></p><ul class="blog-newsletter-benefits"><li>Weekly practice tips</li><li>Early masterclass access</li><li>Community highlights</li><li>Exclusive sheet music</li></ul></section></main>`).replace('<div class="soc"><span>Tk</span><span>Yt</span><span>X</span><span>f</span><span>Ig</span></div>',librarySocialIcons())+'</div>'},

 EarToKeysMusic shall not be liable for any indirect, incidental, or consequential damages arising from your use of the service.</p><h3>Governing Law</h3><p>These terms are governed by and construed in accordance with the laws of the Federal Republic of Nigeria. Any disputes shall be subject to the exclusive jurisdiction of the courts located in Nigeria.</p></section></article><section class="terms-support"><div><h2>Still have questions?</h2><p>Our support team is here to help you understand our terms.</p></div><a class="btn" href="#/support">Contact Us</a></section></div></main>`).replace('<div class="soc"><span>Tk</span><span>Yt</span><span>X</span><span>f</span><span>Ig</span></div>',librarySocialIcons())+'</div>'},
privacy(){const info=[['person','Personal Information','Name, email address, and password when you create an account.'],['music','Music Data','Songs you listen to, playlists you create, favorites, and search history.'],['device','Device Information','Your device type, IP address, browser, and operating system.'],['cookie','Cookies','We use small files to remember your login and improve your music experience.']];return '<div class="courses-reference library-reference privacy-reference">'+pub("home",`<main class="privacy-main"><header class="privacy-intro"><h1>Privacy Policy</h1><p>${privacyIcon('shield')}<span>Updated: October 2023</span></p></header><section class="privacy-notice" aria-label="Privacy policy introduction"><p>We care about your privacy. This policy explains how we collect, use, and protect your information when you use our website. We reserve the right to change this policy at any given time, of which you will receive an update prior to the time of changes.</p><div class="privacy-emphasis">We encourage you to carefully read through this privacy policy to understand how EarToKeysMusic handles your information. So if you agree with the services, go ahead and use it, and if not, don't use the services.</div></section><section class="privacy-section"><h2 class="privacy-heading has-rule">${privacyIcon('database')}<span>Information We Collect</span></h2><div class="privacy-information">${info.map(([icon,title,description])=>`<article class="privacy-information-card"><h3>${privacyIcon(icon)}<span>${title}</span></h3><p>${description}</p></article>`).join('')}</div></section><section class="privacy-section"><h2 class="privacy-heading has-rule">${privacyIcon('chart')}<span>How We Use Your Information</span></h2><ol class="privacy-uses"><li>To give you personalized music recommendations based on your listening patterns.</li><li>To manage your account and track your progress through your piano lessons.</li><li>To send important updates about our services and security notifications.</li><li>To improve our website functionality and troubleshoot technical problems.</li><li>To understand how users interact with and enjoy lessons on the EarToKeysMusic website.</li></ol></section><div class="privacy-studio" role="img" aria-label="Piano and recording studio">${uploadedPhoto(imageFor('feature','privacy-studio'))}</div><section class="privacy-section"><h2 class="privacy-heading">${privacyIcon('share')}<span>Sharing Your Information</span></h2><p class="privacy-sharing">&quot;We do not sell your personal information. We may share information only in these cases: With trusted service partners (like hosting and payment providers) who help us run the site; When required by law; If we merge with another company.&quot;</p></section><section class="privacy-section"><h2 class="privacy-heading">${privacyIcon('shield')}<span>Data Security</span></h2><p>We use strong protection to keep your information safe. However, no system is 100% secure. We do our best to protect your data using industry-standard encryption and security protocols.</p></section><section class="privacy-section"><h2 class="privacy-heading has-rule">${privacyIcon('rights')}<span>Your Rights</span></h2><ul class="privacy-rights"><li>${privacyIcon('edit')}<span>Access or update your personal information at any time via your settings.</span></li><li>${privacyIcon('trash')}<span>Delete your account and data (some listening history may remain for a short time).</span></li><li>${privacyIcon('unsubscribe')}<span>Stop receiving marketing emails with a single click.</span></li></ul></section><section class="privacy-section"><h2 class="privacy-heading">${privacyIcon('sliders')}<span>Cookies and Tracking</span></h2><p>You can control cookies through your browser settings. Some features may not work well if you disable them, as we use these to ensure your lesson progress is saved correctly.</p></section><section class="privacy-contact"><h2>Questions?</h2><p>If you have questions about this policy or how we handle<br class="privacy-wide-break"> your data, our support team is ready to help.</p><a class="btn" href="mailto:support@eartokeysmusic.com">${privacyIcon('mail')}<span>support@eartokeysmusic.com</span></a></section></main>`).replace('<div class="soc"><span>Tk</span><span>Yt</span><span>X</span><span>f</span><span>Ig</span></div>',librarySocialIcons())+'</div>'},
};
const IN={};
A.community=()=>shell("s","app/community",`<h1>Community feed</h1><div class="box" style="margin:16px 0;display:flex;gap:10px"><input id="pt" placeholder="Share your latest practice session or ask a question..." style="flex:1"><button class="btn" onclick="post()">Post</button></div>${S.posts.map((p,i)=>`<div class="box" style="margin-bottom:14px"><b>${p.a}</b> ${p.q?"<span class=tag>Question</span>":""}<p style="margin:8px 0">${esc(p.t)}</p><button class="link" onclick="S.posts[${i}].c++;save();rt()">&#128079; ${p.c} claps</button> &nbsp; <span class="mut">${p.m} comments</span></div>`).join("")}`);
A.uploads=()=>shell("s","app/uploads",`<h1>Submit performance</h1><p class="mut">Share your progress and get detailed feedback from your mentor.</p><div class="two"><div class="box center" style="padding:40px"><h3>Drag and drop your recording</h3><p class="mut">MP4, MOV or WEBM up to 500MB.</p><br><button class="btn" onclick="up.f='recording.mp4';this.textContent=up.f">Select file from computer</button></div><div class="box" style="display:flex;flex-direction:column;gap:12px"><label>Performance title<input id="ut" placeholder="e.g. Nocturne in Eb Major, week 4"></label><label>Course<select>${CS.map(c=>`<option>${c[0]}</option>`).join("")}</select></label><label>Notes for instructor<input></label><button class="btn w" onclick="sub()">Submit for review</button><span class="mut">Typically reviewed within 24-48 hours.</span></div></div><h3 style="margin-top:22px">Your submissions</h3><div class="box">${S.rev.filter(r=>r.s==S.user.name).map(r=>`<div class="row"><span>${r.p}</span><b>${r.st=="Pending"?"Awaiting review":"Grade "+r.g}</b></div>`).join("")||"<span class=mut>Nothing submitted yet.</span>"}</div>`);
A.book=()=>{if(bk.done)return shell("s","app/book",`<div class="box center" style="max-width:480px;margin:40px auto"><h1>Your session is confirmed!</h1><p class="mut">${BT[bk.t][0]} with ${BI[bk.i][0]}<br>${bk.date} at ${bk.slot}</p><br><button class="btn" onclick="bk.done=false;go('#/app/dash')">Back to dashboard</button></div>`);
return shell("s","app/book",`<h1>Reserve your studio time</h1><p class="mut">Choose your focus, select a mentor, and secure your time.</p><div class="two"><div><h3>1. Session type</h3><div class="cards" style="grid-template-columns:1fr;margin:10px 0">${BT.map((t,i)=>`<button class="pc" aria-pressed="${bk.t==i}" onclick="bk.t=${i};rt()"><b style="font-size:18px">${t[0]}</b><span class="mut">${t[1]} &middot; $${t[2]}</span></button>`).join("")}</div><h3>2. Instructor</h3><div class="cards" style="grid-template-columns:1fr;margin:10px 0">${BI.map((t,i)=>`<button class="pc" aria-pressed="${bk.i==i}" onclick="bk.i=${i};rt()"><b style="font-size:18px">${t[0]}</b><span class="mut">${t[1]}</span></button>`).join("")}</div></div><div class="box" style="display:flex;flex-direction:column;gap:12px"><h3>3. Schedule</h3><label>Date<input type="date" value="${bk.date}" onchange="bk.date=this.value"></label><div class="tabs">${["09:00 AM","10:30 AM","01:00 PM","03:30 PM"].map(x=>`<button class="chip ${bk.slot==x?"on":""}" onclick="bk.slot='${x}';rt()">${x}</button>`).join("")}</div><div class="row"><b>Total</b><b style="color:var(--o)">$${BT[bk.t][2]}</b></div><button class="btn w" onclick="S.book.push({s:S.user.name,t:BT[bk.t][0],d:bk.date,h:bk.slot});save();bk.done=true;rt()">Complete reservation</button><span class="mut">Free cancellation up to 24 hours before.</span></div></div>`)};
IN.student=i=>{const x=S.stud[i];if(!x)return IN.students();return shell("inst","studio/students",`<button class="link" onclick="go('#/studio/students')">&larr; Back to roster</button><h1 style="margin-top:8px">${x[0]}</h1><p class="mut">${x[3]} day practice streak &middot; ${x[1]}</p><div class="two"><div class="box"><h3>Learning path</h3><div class="row"><span>${x[1]}</span><b>${x[2]}%</b></div><div class="bar"><i style="width:${x[2]}%"></i></div><br><h3>Performance history</h3>${S.rev.filter(r=>r.s==x[0]).map(r=>`<div class="row"><span>${r.p}</span><b>${r.g||r.st}</b></div>`).join("")||"<span class=mut>No submissions yet.</span>"}</div><div class="box" style="display:flex;flex-direction:column;gap:10px"><h3>Pedagogy notes</h3><textarea id="pn" rows="5" style="background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;color:inherit">${S.notes[x[0]]||""}</textarea><button class="btn" onclick="S.notes['${x[0]}']=$('#pn').value;save();toast('Notes saved')">Save notes</button><button class="btn out" onclick="toast('Message sent')">Send message</button></div></div>`)};
IN.sessions=()=>shell("inst","studio/sessions",`<h1>Start new session</h1><p class="mut">Select your session type to begin.</p><div class="cards">${[["Live masterclass","Broadcast to your students live."],["Studio recording","Capture high-fidelity lessons."],["1:1 coaching","Hold a private, personalized session."]].map(c=>`<button class="pc" onclick="toast('${c[0]} ready')"><h3>${c[0]}</h3><span class="mut">${c[1]}</span></button>`).join("")}</div><h3>Booked by students</h3><div class="box">${S.book.map(b=>`<div class="row"><span>${b.t}<br><span class="mut">${b.s}</span></span><b>${b.d}, ${b.h}</b></div>`).join("")||"<span class=mut>No bookings yet. Students can reserve time from Book a session.</span>"}</div>`);
function post(){const t=$("#pt").value.trim();if(!t)return toast("Write something first");S.posts.unshift({a:S.user.name,t,c:0,m:0});save();rt()}
function sub(){const t=$("#ut").value.trim();if(!t)return toast("Add a performance title");if(!up.f)return toast("Select a recording first");S.rev.unshift({s:S.user.name,p:t,d:"Today",st:"Pending"});up={f:""};save();toast("Submitted for review");rt()}
Object.assign(IN,{
studio(){const pend=S.rev.filter(r=>r.st=="Pending");return shell("inst","studio",`<h1>Welcome back, ${S.user.name}.</h1><p class="mut">Your studio is flourishing. You have ${pend.length} performance reviews awaiting feedback.</p><div class="stats"><div class="box"><b>1,284</b>Total students</div><div class="box"><b>${S.ilessons.length}</b>Lessons</div><div class="box"><b>84%</b>Completion rate</div><div class="box"><b>$14,200</b>Monthly revenue</div></div><div class="two"><div><h3>Pending performance reviews</h3><div class="box">${pend.map(r=>`<div class="row"><span><b>${r.s}</b><br><span class="mut">${r.p}</span></span><button class="btn out sm" onclick="go('#/studio/reviews/${S.rev.indexOf(r)}')">Review</button></div>`).join("")||"<span class=mut>All caught up.</span>"}</div><h3 style="margin-top:18px">Recent student progress</h3><div class="box">${S.stud.slice(0,3).map(x=>`<div class="row"><span>${x[0]}<br><span class="mut">${x[1]}</span></span><span style="width:90px">${x[2]}%<div class="bar"><i style="width:${x[2]}%"></i></div></span></div>`).join("")}</div></div><div><h3>Quick actions</h3><div class="box"><button class="btn dk w" onclick="newC()">Create new course</button><br><br><button class="btn out w" onclick="go('#/studio/lesson')">Upload lesson</button></div><h3 style="margin-top:18px">Activity feed</h3><div class="box mut">David Chen enrolled in Piano Masterclass<br><br>Sophia Wood submitted an assignment<br><br>New 5-star rating on The Art of Legato</div></div></div>`)},
students(){return shell("inst","studio/students",`<h1>Student roster</h1><div class="stats"><div class="box"><b>42</b>Total students</div><div class="box"><b>86%</b>Active practice</div><div class="box"><b>28</b>Lessons this week</div></div><div class="tw"><table><tr><th>Student</th><th>Enrollment</th><th>Progress</th><th>Streak</th><th>Last active</th></tr>${S.stud.map(x=>`<tr><td><button class="link" onclick="go('#/studio/student/${S.stud.indexOf(x)}')">${x[0]}</button></td><td>${x[1]}</td><td style="min-width:120px">${x[2]}%<div class="bar"><i style="width:${x[2]}%"></i></div></td><td>${x[3]} days</td><td>${x[4]}</td></tr>`).join("")}</table></div><p class="mut">Showing ${S.stud.length} of 42 students</p>`)},
reviews(i){const r=i!=null&&S.rev[i];if(r)return shell("inst","studio/reviews",`<button class="link" onclick="go('#/studio/reviews')">&larr; Back to queue</button><h1>${r.p}</h1><p class="mut">${r.s} &middot; submitted ${r.d}</p><div class="two"><div class="vid" style="margin-top:14px"><div class="ctl">&#9654; Student recording</div></div><div class="box" style="display:flex;flex-direction:column;gap:12px"><h3>Feedback</h3>${["Technique","Dynamics","Tempo stability","Musicality"].map(k=>`<label>${k}<input type="range" min="1" max="10" value="7" class="rv" ${r.st!="Pending"?"disabled":""}></label>`).join("")}<label>Notes for the student<input id="rn" value="${r.n||""}"></label>${r.st=="Pending"?`<button class="btn w" onclick="rate(${i})">Complete evaluation</button>`:`<b>Grade: ${r.g}</b>`}</div></div>`);
return shell("inst","studio/reviews",`<h1>Performance reviews</h1><div class="stats"><div class="box"><b>${S.rev.filter(x=>x.st=="Pending").length}</b>Pending reviews</div><div class="box"><b>18h</b>Avg. response time</div><div class="box"><b>${S.rev.filter(x=>x.st!="Pending").length}</b>Completed</div></div><div class="tw"><table><tr><th>Student</th><th>Piece</th><th>Submitted</th><th>Status</th><th></th></tr>${S.rev.map((x,j)=>`<tr><td>${x.s}</td><td>${x.p}</td><td>${x.d}</td><td>${x.st}</td><td><button class="btn ${x.st=="Pending"?"":"out"} sm" onclick="go('#/studio/reviews/${j}')">${x.st=="Pending"?"Start review":"View results"}</button></td></tr>`).join("")}</table></div>`)}

async function preload(a,b,c){
  if(a=="courses")return loadCourses();
  if(a=="course"){if(S.cdetSlug!=b){dm=0;dt="notes"}S.cdetSlug=b;try{S.cdet=await ETK.course(b)}catch(e){if(e.status==404)S.cdet=null;else throw e}return}
  if(a=="library")return loadRes();
  if(a=="app"){
    if(b=="resources")return loadRes();
    if(b=="account")return loadHist();
    if(b=="uploads")return loadCourses();
    if(["community","book","settings"].includes(b))return;
    return loadLessons()
  }
  if(a=="studio"){S.studioErr="";try{await loadStudio();if(b=="resources")await loadRes()}catch(e){if(e.status==403)S.studioErr=e.message;else throw e}return}
  if(a=="admin"){
    const t=b||"admin";
    if(t=="admin")S.ov=await ETK.call("GET","/api/admin/overview");
    else if(t=="videos")await loadStudio();
    else if(t=="users")S.users=(await ETK.call("GET","/api/admin/users"+(uq?"?q="+encodeURIComponent(uq):""))).users;
    else if(t=="payments")S.pays=(await ETK.call("GET","/api/admin/payments")).payments;
    else if(t=="resources")await loadRes();
    else if(t=="images")S.adminImages=(await ETK.call("GET","/api/admin/images")).images;
    else if(t=="newsletter")S.newsletter=(await ETK.call("GET","/api/admin/newsletter")).subscribers;
    else if(t=="support")S.msgs=(await ETK.call("GET","/api/admin/support")).messages
  }
}

// ---------- payments (Paystack hosted page; the server verifies the money and grants access) ----------
async function pay(){
  const i=[...document.querySelectorAll("input[name=m]")].findIndex(x=>x.checked),b=$("#pay");
  if(b.disabled)return;save();b.disabled=true;b.textContent="Opening secure payment...";
  try{const r=await ETK.checkout(S.pick,S.bill=="y"?"annual":"monthly",["card","paystack","bank_transfer"][i<0?1:i]);location.href=r.authorizationUrl}
  catch(e){b.disabled=false;b.textContent="Pay securely";if(e.code=="email_not_verified"){toast("Verify your email first");go("#/verify")}else fail(e)}
}
function pollPay(ref){
  if(!ref)return go("#/app/dash");
  let n=0;
  const tick=async()=>{
    if(!location.hash.startsWith("#/securing"))return;
    try{const d=await ETK.paymentStatus(ref),s=d.payment.status;if(s=="success"){setAccess(d.access);return go("#/success")}if(s!="pending")return go("#/failed")}catch(e){if(e.status==401)return fail(e)}
    if(++n>60)return go("#/failed");
    pollT=setTimeout(tick,2000)
  };
  tick()
}

async function initPlayer(id){
  const vd=$("#pv");if(!vd)return;

function upV(id){const i=document.createElement("input");i.type="file";i.accept="video/mp4,video/webm,video/quicktime,.mp4,.mov,.webm";i.onchange=async()=>{const f=i.files[0];if(!f)return;try{prog(0);await ETK.upload("/api/studio/lessons/"+id+"/file",f,prog,vtype(f));toast("Video uploaded");await reload()}catch(e){fail(e)}};i.click()}
async function pubV(id){const v=S.ilessons.find(x=>x.id==id);if(!v)return;try{await ETK.call("PATCH","/api/studio/lessons/"+id,{published:!v.published});await reload()}catch(e){fail(e)}}
async function delL(id){if(!confirm("Remove this lesson and its video?"))return;try{await ETK.call("DELETE","/api/studio/lessons/"+id);await reload()}catch(e){fail(e)}}
async function newC(){const t=prompt("Course title");if(!t)return;const lv=prompt("Level: Beginner, Intermediate or Advanced","Beginner");if(!L.includes(lv))return toast("Level must be Beginner, Intermediate or Advanced");try{const d=await ETK.call("POST","/api/studio/courses",{title:t,level:lv,hours:0,description:""});S.ci=d.course.id;ls.courseId=S.ci;if(location.hash=="#/studio/courses")await reload();else go("#/studio/courses")}catch(e){fail(e)}}
async function editC(id){const c=cOf(id),t=prompt("Course title",c.title);if(!t)return;const h=prompt("Total hours of content",c.hours);const d=prompt("Short description",c.description||"");try{await ETK.call("PATCH","/api/studio/courses/"+id,{title:t,hours:+h||0,description:d||""});await reload()}catch(e){fail(e)}}
async function togC(id,p){try{await ETK.call("PATCH","/api/studio/courses/"+id,{published:!!p});toast(p?"Course published":"Course unpublished");await reload()}catch(e){fail(e)}}
function addL(mi){const mods=[...new Set(S.ilessons.filter(l=>l.courseId==S.ci).map(l=>l.module))];ls.courseId=S.ci;ls.m=mods[mi]||"Module 1";go("#/studio/lesson")}
function addM(){const m=prompt("Module name");if(!m)return;ls.courseId=S.ci;ls.m=m.trim();go("#/studio/lesson")}

// ---------- admin ----------
const AD={
newsletter(){return shell('admin','admin/newsletter',`<h1>Newsletter subscribers</h1><p class="mut">People who signed up through the Blog page. Showing the latest 200 subscribers.</p><br><div class="tw"><table><thead><tr><th>Email</th><th>Subscribed</th></tr></thead><tbody>${(S.newsletter||[]).map(x=>`<tr><td>${esc(x.email)}</td><td>${when(x.createdAt)}</td></tr>`).join('')||'<tr><td colspan="2" class="mut">No subscribers yet.</td></tr>'}</tbody></table></div>`)},

images(){const images=(S.adminImages||[]).filter(x=>imageFilter==='all'||imageGroup(x)===imageFilter);return shell("admin","admin/images",`<h1>Product images</h1><p class="mut">Upload course covers, resource pictures, featured library artwork, testimonial pictures, team portraits, and founder page images. JPG, PNG or WebP, up to 5 MB.</p><div class="tabs" role="group" aria-label="Image type">${[['all','All images'],['course','Course covers'],['resource','Resources'],['feature','Featured panels'],['testimonials','Testimonials'],['about','About & team'],['founder','Founder page'],['legal','Legal pages'],['blog','Blog']].map(([key,label])=>`<button class="chip ${imageFilter===key?'on':''}" aria-pressed="${imageFilter===key}" onclick="imageFilter='${key}';rt()">${label}</button>`).join('')}</div><div class="admin-image-grid">${images.map(x=>`<article class="box admin-image-card"><div class="admin-image-preview">${x.imageUrl?`<img src="${esc(x.imageUrl)}" alt="${esc(x.title)}">`:'<span class="mut">No image uploaded</span>'}</div><span class="tag">${IMAGE_GROUP_LABELS[imageGroup(x)]}</span><h2>${esc(x.title)}</h2><div class="admin-image-actions"><button class="btn sm" data-image-action onclick="upCatalogImage('${x.kind}','${x.target}')">${x.imageUrl?'Replace image':'Upload image'}</button>${x.imageUrl?`<button class="btn out sm" data-image-action onclick="removeCatalogImage('${x.kind}','${x.target}')">Remove image</button>`:''}</div>${['cindy','haifeng','nayelie'].includes(x.target)?`<div class="admin-image-actions"><button class="btn sm" data-image-action onclick="upTestimonialVideo('${x.target}')">${x.videoUrl?'Replace video':'Upload video'}</button>${x.videoUrl?`<button class="btn out sm" onclick="playTestimonial('${x.target}')">Preview video</button><button class="btn out sm" data-image-action onclick="removeTestimonialVideo('${x.target}')">Remove video</button>`:''}</div><p class="mut">MP4, WebM or MOV, up to 100 MB.</p>`:''}</article>`).join('')||'<p class="mut">No items in this category.</p>'}</div>`)},

admin(){const o=S.ov||{users:{},subscriptions:{},revenue30d:{},lessons:{}};return shell("admin","admin",`<h1>Admin overview</h1><div class="stats"><div class="box"><b>${o.users.students}</b>Students</div><div class="box"><b>${o.subscriptions.active}</b>Active subscriptions</div><div class="box"><b>${o.subscriptions.grace}</b>In grace period</div><div class="box"><b>${o.subscriptions.expired}</b>Expired</div><div class="box"><b>${naira(o.revenue30d.amount)}</b>Revenue, last 30 days</div><div class="box"><b>${o.lessons.published}/${o.lessons.total}</b>Published lessons</div><div class="box"><b>${o.lessons.awaitingVideo}</b>Lessons awaiting video</div><div class="box"><b>${o.users.pendingInstructors}</b>Instructors to approve</div><div class="box"><b>${o.openSupport}</b>Open support messages</div></div>`)},
videos(){return shell("admin","admin/videos",`<div class="row"><h1>Videos</h1><button class="btn sm" onclick="go('#/studio/lesson')">+ Add video</button></div><div class="tw"><table><tr><th>Title</th><th>Course</th><th>Level</th><th>Length</th><th>Status</th><th>Video</th><th></th></tr>${S.ilessons.map(v=>`<tr><td>${esc(v.title)}</td><td>${esc(cOf(v.courseId).title||"")}</td><td>${esc(cOf(v.courseId).level||"")}</td><td>${mins(v.durationSec)} min</td><td>${v.published?"Published":"Draft"}</td><td>${v.hasVideo?(v.sizeBytes?(v.sizeBytes/1048576).toFixed(1)+" MB":"Uploaded"):"Missing"}</td><td style="white-space:nowrap"><button class="btn out sm" onclick="upV(${v.id})">${v.hasVideo?"Replace":"Upload"}</button> <button class="btn out sm" onclick="pubV(${v.id})">${v.published?"Unpublish":"Publish"}</button></td></tr>`).join("")}</table></div>`)},
users(){return shell("admin","admin/users",`<h1>Users</h1><br><div class="row" style="justify-content:flex-start"><input id="uq" placeholder="Search name or email" value="${esc(uq)}" onkeydown="if(event.key=='Enter'){uq=this.value.trim();reload()}" style="width:280px"><button class="btn out sm" onclick="uq=$('#uq').value.trim();reload()">Search</button></div><br><div class="tw"><table><tr><th>Name</th><th>Email</th><th>Role</th><th>Plan</th><th>Access</th><th></th></tr>${S.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}${u.emailVerified?"":' <span class="mut">(unverified)</span>'}</td><td>${esc(u.role)}${u.disabled?" (disabled)":""}</td><td>${esc(u.access&&u.access.plan||"None")}</td><td>${esc(u.access&&u.access.state||"none")}${u.access&&u.access.state=="grace"?" ("+u.access.graceDaysLeft+"d left)":""}</td><td style="white-space:nowrap">${u.role=="student"?`<select id="gp${u.id}" style="width:auto">${L.map(l=>`<option>${l}</option>`).join("")}</select> <button class="btn out sm" onclick="grant(${u.id})">Grant 1 month</button> `:""}${u.role=="instructor"?(u.instructorApproved?"Approved ":`<button class="btn out sm" onclick="approveI(${u.id})">Approve</button> `):""}${u.id==S.user.id?"":`<button class="link" onclick="disableU(${u.id},${u.disabled?0:1})">${u.disabled?"Enable":"Disable"}</button>`}</td></tr>`).join("")}</table></div>`)},
payments(){return shell("admin","admin/payments",`<h1>Payments</h1><br><div class="tw"><table><tr><th>Date</th><th>Email</th><th>Plan</th><th>Amount</th><th>Status</th><th>Reference</th></tr>${(S.pays||[]).map(p=>`<tr><td>${when(p.createdAt)}</td><td>${esc(p.email)}</td><td>${esc(p.plan)} ${esc(p.billing)}</td><td>${naira(p.amount)}</td><td>${esc(p.status)}${p.failureReason?" ("+esc(p.failureReason)+")":""}</td><td class="mut">${esc(p.reference)}</td></tr>`).join("")||'<tr><td colspan="6" class="mut">No payments yet.</td></tr>'}</table></div>`)},
resources(){return shell("admin","admin/resources",`<h1>Resources</h1><p class="mut">Sheet music and MIDI files for the library.</p><button class="btn out sm" onclick="go('#/admin/images')">Manage resource pictures</button><br><div class="box" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;align-items:end"><label>Title<input id="ar_t"></label><label>Subtitle<input id="ar_s"></label><label>Type<select id="ar_k"><option>PDF</option><option>MIDI</option><option>DOC</option></select></label><label>Category<select id="ar_c"><option>Sheet Music</option><option>MIDI Files</option></select></label><label>Needs plan<select id="ar_l"><option value="">Free (no plan)</option>${L.map(l=>`<option>${l}</option>`).join("")}</select></label><label class="opt" style="flex-direction:row;margin:0"><input type="checkbox" id="ar_f">Featured</label><button class="btn" onclick="addR()">Add resource</button></div><br><div class="tw"><table><tr><th>Name</th><th>Type</th><th>Category</th><th>Plan</th><th>File</th><th></th></tr>${S.pubres.map(r=>`<tr><td>${esc(r.title)}</td><td>${esc(r.kind)}</td><td>${esc(r.category)}</td><td>${esc(r.minLevel||"Free")}</td><td>${r.available?"Uploaded":"Missing"}</td><td><button class="btn out sm" onclick="upR(${r.id})">${r.available?"Replace file":"Upload file"}</button></td></tr>`).join("")}</table></div>`)},
support(){return shell("admin","admin/support",`<h1>Support messages</h1><br><div class="tw"><table><tr><th>Date</th><th>From</th><th>Subject</th><th>Message</th><th></th></tr>${(S.msgs||[]).map(m=>`<tr><td>${when(m.created_at)}</td><td>${esc(m.name)}<br><span class="mut">${esc(m.email)}</span></td><td>${esc(m.subject)}</td><td style="max-width:360px">${esc(m.message)}</td><td>${m.status=="open"?`<button class="btn out sm" onclick="closeM(${m.id})">Close</button>`:"Closed"}</td></tr>`).join("")||'<tr><td colspan="5" class="mut">No messages.</td></tr>'}</table></div>`)}
};
async function grant(id){try{await ETK.call("POST","/api/admin/users/"+id+"/grant",{plan:$("#gp"+id).value,billing:"monthly",note:"Granted from the admin panel"});toast("Access granted");await reload()}catch(e){fail(e)}}
async function approveI(id){try{await ETK.call("POST","/api/admin/instructors/"+id+"/approve",{approved:true});toast("Instructor approved");await reload()}catch(e){fail(e)}}
async function disableU(id,off){try{await ETK.call("POST","/api/admin/users/"+id+"/disable",{disabled:!!off});await reload()}catch(e){fail(e)}}
async function closeM(id){try{await ETK.call("POST","/api/admin/support/"+id+"/close");await reload()}catch(e){fail(e)}}
async function addR(){const t=$("#ar_t").value.trim();if(!t)return toast("Add a title");try{await ETK.call("POST","/api/admin/resources",{title:t,subtitle:$("#ar_s").value.trim(),kind:$("#ar_k").value,category:$("#ar_c").value,minLevel:$("#ar_l").value||undefined,featured:$("#ar_f").checked});toast("Resource added. Now upload its file.");await reload()}catch(e){fail(e)}}
function playTestimonial(target){const records=route().a==='admin'?S.adminImages:S.catalogImages;const record=(records||[]).find(x=>x.kind==='feature'&&x.target===target);if(!record?.videoUrl)return toast('This performance video has not been uploaded yet.');document.querySelector('#testimonial-player')?.close();const dialog=document.createElement('dialog');dialog.id='testimonial-player';dialog.className='testimonial-player';dialog.setAttribute('aria-label','Student performance');dialog.innerHTML='<button class="testimonial-close" aria-label="Close video">&times;</button><video controls playsinline></video><p class="mut" hidden>This video could not be loaded.</p>';const video=dialog.querySelector('video');video.src=record.videoUrl;video.poster=record.imageUrl||'';video.onerror=()=>dialog.querySelector('p').hidden=false;dialog.querySelector('button').onclick=()=>dialog.close();dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});dialog.addEventListener('close',()=>{video.pause();video.removeAttribute('src');video.load();dialog.remove()},{once:true});document.body.append(dialog);dialog.showModal();video.play().catch(()=>{})}
function upTestimonialVideo(target){if(imageBusy)return;const input=document.createElement('input');input.type='file';input.accept='.mp4,.webm,.mov';input.onchange=async()=>{const file=input.files[0];if(!file)return;const mime={mp4:'video/mp4',webm:'video/webm',mov:'video/quicktime'}[file.name.split('.').pop().toLowerCase()];if(!mime)return toast('Choose an MP4, WebM or MOV video.');if(file.size>100*1048576)return toast('Choose a video smaller than 100 MB.');try{setImageBusy(true);prog(0);await ETK.upload('/api/admin/testimonials/'+target+'/video',file,prog,mime);toast('Performance video uploaded');await reload()}catch(e){fail(e)}finally{setImageBusy(false)}};input.click()}
async function removeTestimonialVideo(target){if(imageBusy||!confirm('Remove this performance video?'))return;try{setImageBusy(true);await ETK.call('DELETE','/api/admin/testimonials/'+target+'/video');toast('Performance video removed');await reload()}catch(e){fail(e)}finally{setImageBusy(false)}}
function setImageBusy(busy){imageBusy=busy;document.querySelectorAll('[data-image-action]').forEach(b=>b.disabled=busy)}
function upCatalogImage(kind,target){if(imageBusy)return;const input=document.createElement('input');input.type='file';input.accept='.jpg,.jpeg,.png,.webp';input.onchange=async()=>{const file=input.files[0];if(!file)return;const ext=file.name.split('.').pop().toLowerCase(),mime={jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp'}[ext];if(!mime)return toast('Choose a JPG, PNG or WebP image.');if(file.size>5*1048576)return toast('Choose an image smaller than 5 MB.');try{setImageBusy(true);prog(0);await ETK.upload('/api/admin/images/'+kind+'/'+target,file,prog,mime);toast('Image uploaded. It is now used on the website.');await reload()}catch(e){fail(e)}finally{setImageBusy(false)}};input.click()}
async function removeCatalogImage(kind,target){if(imageBusy||!confirm('Remove this image? The website will use its default picture.'))return;try{setImageBusy(true);await ETK.call('DELETE','/api/admin/images/'+kind+'/'+target);toast('Image removed');await reload()}catch(e){fail(e)}finally{setImageBusy(false)}}
function upR(id){const i=document.createElement("input");i.type="file";i.accept=".pdf,.mid,.midi,.zip";i.onchange=async()=>{const f=i.files[0];if(!f)return;const ext=(f.name.split(".").pop()||"").toLowerCase(),ct={pdf:"application/pdf",mid:"audio/midi",midi:"audio/midi",zip:"application/zip"}[ext];if(!ct)return toast("Use a PDF, MIDI (.mid) or ZIP file");try{prog(0);await ETK.upload("/api/admin/resources/"+id+"/file",f,prog,ct);toast("File uploaded");await reload()}catch(e){fail(e)}};i.click()}

// ---------- router ----------
const PROTECTED=["app","admin","studio","level","verify","plans","checkout","securing","success","failed","onboard"];
function route(){const raw=location.hash.replace(/^#\/?/,"")||"home",i=raw.indexOf("?");Q=new URLSearchParams(i<0?"":raw.slice(i+1));const[a,b,c]=(i<0?raw:raw.slice(0,i)).split("/");return{a,b,c}}
function render(){
  clearTimeout(pollT);clearInterval(wmT);
  const{a,b,c}=route();let o;
  if(a=="home"){$("#app").innerHTML='<div id="lp"></div>';const r=$("#lp").attachShadow({mode:"open"});r.innerHTML=LP;initLanding(r);return}
  if(PROTECTED.includes(a)&&!S.user)return go("#/login");
  if(a=="studio"&&S.studioErr)o=shell("inst","studio",`<div class="box center" style="max-width:520px;margin:40px auto"><h1>Almost there</h1><p class="mut">${esc(S.studioErr)}</p></div>`);
  else if(a=="app")o=(A[b||"dash"]||A.dash)(c);
  else if(a=="admin")o=(AD[b||"admin"]||AD.admin)();
  else if(PUB[a])o=PUB[a](b);
  else if(a=="studio")o=(IN[b||"studio"]||IN.studio)(c);
  else o=(V[a]||V.login)(b);
  $("#app").innerHTML=PUB[a]?o:`<div class="workspace-ui ${["app","admin","studio"].includes(a)?"dashboard-ui":"account-ui"} route-${esc(a)}" data-screen="${esc([a,b,c].filter(Boolean).join('/'))}">${a==='onboard'?'<p class="prototype-notice account-preview">Preview: these onboarding profile fields are not saved. Your account and approval status are saved.</p>':''}${o}</div>`
}
async function nav(quiet){
  const my=++rid,{a,b,c}=route();
  const lt=quiet?0:setTimeout(()=>{if(my===rid&&a!="home")$("#app").innerHTML='<div class="page center mut" style="padding-top:120px">Loading&hellip;</div>'},300);
  try{
    if(S.user||!booted)await refreshMe();
    booted=true;
    if(my!==rid)return;
    if(PROTECTED.includes(a)&&!S.user)return go("#/login");
    if((a=="admin"&&S.user.role!="admin")||(a=="studio"&&S.user.role=="sub"))return go("#/"+home());
    await Promise.all([preload(a,b,c),["home","courses","course","library","testimonials","about","founder","terms","privacy","blog","app","studio"].includes(a)?loadCatalogImages():Promise.resolve()])
  }catch(e){if(my!==rid)return;if(e&&e.status==401)return fail(e);toast((e&&e.message)||"Could not load this page.")}
  finally{clearTimeout(lt)}
  if(my!==rid)return;
  render();
  if(a=="app"&&b=="play")initPlayer(c);
  if(a=="securing")pollPay(Q.get("reference"))
}
addEventListener("hashchange",()=>{scrollTo(0,0);nav()});
</script><link rel="stylesheet" href="/student-ui.css"><script src="/student-ui.js"></script><script>
(async()=>{try{await loadPlans()}catch(e){}nav()})();
</script></body></html>
